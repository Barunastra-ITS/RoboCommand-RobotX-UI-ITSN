# RoboCommand course host DHCP (isc-dhcp-server), written by scripts/dhcp/install_dhcp.sh
#
# One subnet per course network (Team Handbook §3.4). dhcpd only serves the
# subnet that matches the address on the interface in INTERFACESv4, so to
# move to another course just change the wired IP to that course's host
# address (.2); the NetworkManager hook restarts dhcpd when the link comes up.
#
#   Course Alpha  host 192.168.65.2   teams get .15 - .254
#   Course Bravo  host 192.168.66.2
#   Course Charlie host 192.168.67.2
#   Course Delta  host 192.168.68.2
#   Demo (VLAN 70) host 192.168.70.2

authoritative;
default-lease-time 600;
max-lease-time 7200;
# Course networks are offline: no DNS. The host is the gateway so a GCS
# that needs a default route still gets one.

# Course Alpha
subnet 192.168.65.0 netmask 255.255.255.0 {
  range 192.168.65.15 192.168.65.254;
  option subnet-mask 255.255.255.0;
  option routers 192.168.65.2;
  option broadcast-address 192.168.65.255;
}

# Course Bravo
subnet 192.168.66.0 netmask 255.255.255.0 {
  range 192.168.66.15 192.168.66.254;
  option subnet-mask 255.255.255.0;
  option routers 192.168.66.2;
  option broadcast-address 192.168.66.255;
}

# Course Charlie
subnet 192.168.67.0 netmask 255.255.255.0 {
  range 192.168.67.15 192.168.67.254;
  option subnet-mask 255.255.255.0;
  option routers 192.168.67.2;
  option broadcast-address 192.168.67.255;
}

# Course Delta
subnet 192.168.68.0 netmask 255.255.255.0 {
  range 192.168.68.15 192.168.68.254;
  option subnet-mask 255.255.255.0;
  option routers 192.168.68.2;
  option broadcast-address 192.168.68.255;
}

# Demo (VLAN 70)
subnet 192.168.70.0 netmask 255.255.255.0 {
  range 192.168.70.15 192.168.70.254;
  option subnet-mask 255.255.255.0;
  option routers 192.168.70.2;
  option broadcast-address 192.168.70.255;
}
